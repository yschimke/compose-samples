name: Design Artifacts

# Render each sample's `@Preview` catalog and publish its importable sticker
# sheet to a clean `design-artifacts/<system>` branch, which the public preview
# server (preview.coo.ee) serves at /<system>/.
#
# Every sample declares its inventory in a `catalog.spec.json` pointing at the
# `@Preview` functions the sample already ships — adopting compose-preview here
# cost a plugin line per module plus that file, with no UI code changes.
#
# The render → validate → generate → publish pipeline is delegated wholesale to
# the reusable workflow in compose-ai-tools; this file is only the per-sample
# matrix. Note that each sample is its OWN Gradle build (JetNews/gradlew,
# Jetcaster/gradlew, …) with no build at the repo root, hence working-directory.

on:
  workflow_dispatch:
    inputs:
      allow_incomplete:
        description: 'Publish even if some previews fail to render or lack semantics (use while tuning a spec).'
        type: boolean
        default: false
  # A scheduled run always uses the DEFAULT branch's copy of this file, which is
  # why the publish job renders `ref: previews` explicitly rather than the
  # triggering ref. It has no inputs, so `inputs.allow_incomplete` is empty and
  # the publish job falls back to each matrix entry's own `allowIncomplete`.
  # Weekly so the catalogs pick up compose-ai-tools changes that land on `main`
  # (the reusable workflow is `@main`) even when nothing on `previews` moves.
  schedule:
    - cron: '20 2 * * 3' # Wednesdays 02:20 UTC — weekly, at a quiet time, off the top of the hour
  push:
    branches:
      - previews
    paths:
      - '*/catalog*.spec.json'
      - '*/app/src/debug/**'
      - '*/app/src/main/**'
      - '*/app/build.gradle.kts'
      - 'Jetcaster/mobile/src/main/**'
      - 'Jetcaster/wear/src/debug/**'
      - 'Jetcaster/wear/src/main/**'
      - 'Jetcaster/core/designsystem/src/main/**'
      - 'Jetcaster/mobile/build.gradle.kts'
      - 'Jetcaster/wear/build.gradle'
      - '.github/workflows/design-artifacts.yml'
      # A compose-preview bump changes what discovery finds and how it renders —
      # 0.17.23's defaulted-parameter discovery is exactly that — so the
      # published catalogs go stale on a version change just as surely as on a
      # spec edit. Without this the bump lands and the delivery branches keep
      # serving the previous renderer's output until someone dispatches by hand.
      - '*/gradle/libs.versions.toml'

permissions:
  contents: read

concurrency:
  # Every trigger renders `previews` and pushes the same delivery branches, so
  # every run shares one queue. Spelled as the literal key a push to `previews`
  # evaluates `design-artifacts-${{ github.ref }}` to, so a scheduled or
  # dispatched run (ref `main`) also queues behind one started from the
  # `previews` copy of this file instead of racing it.
  group: design-artifacts-refs/heads/previews
  cancel-in-progress: false

jobs:
  # Each sample's theme tab comes from its own @ThemeCatalog providers (catalog/*ThemeCatalogs.kt),
  # rendered in the sample's build against its real MaterialTheme. There used to be a re-themed
  # "Material 3" tab as well: compose-ai-tools' pre-rendered compose-m3 bundle re-coloured with a
  # palette scraped from the Kotlin theme sources. It never ran the sample's theme, type, shapes or
  # material3 version, so it showed a guess rather than a render, and it is gone.
  publish:
    # Never let a fork of this fork push delivery branches here.
    if: ${{ github.repository == 'yschimke/compose-samples' }}
    name: ${{ matrix.system }}
    permissions:
      contents: write
    strategy:
      # One sample's render failing shouldn't stop the others publishing.
      fail-fast: false
      matrix:
        include:
          - system: jetnews
            spec: JetNews/catalog.spec.json
            dir: JetNews
            module: ':app'
          - system: jetcaster
            spec: Jetcaster/catalog.spec.json
            dir: Jetcaster
            module: ':mobile'
          - system: jetchat
            spec: Jetchat/catalog.spec.json
            dir: Jetchat
            module: ':app'
          - system: jetsnack
            spec: Jetsnack/catalog.spec.json
            dir: Jetsnack
            module: ':app'
            # figma-svg makes this 113-preview catalog exceed the renderer's separate,
            # fixed 180-second metadata subscriber deadline (compose-ai-tools#2857).
            # PNG/SVG rendering still completes; publish while late auxiliary metadata
            # is partial until that upstream deadline follows --timeout.
            allowIncomplete: true
          - system: jetlagged
            spec: JetLagged/catalog.spec.json
            dir: JetLagged
            module: ':app'
          - system: reply
            spec: Reply/catalog.spec.json
            dir: Reply
            module: ':app'
          - system: jetcaster-wear
            spec: Jetcaster/catalog.wear.spec.json
            dir: Jetcaster
            module: ':wear'
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@main
    with:
      system: ${{ matrix.system }}
      spec: ${{ matrix.spec }}
      module: ${{ matrix.module }}
      working-directory: ${{ matrix.dir }}
      # Render `previews`, the branch the catalogs live on — not whatever ref
      # triggered this. Only matters for triggers that can't imply the ref: a
      # `workflow_dispatch` or `schedule` runs solely the default branch's copy of
      # this file and would otherwise render a `main` that carries no
      # catalog.spec.json at all.
      ref: previews
      # Carry the executable render bundle onto the delivery branch and split it
      # per preview, so preview.coo.ee re-renders these live instead of replaying
      # baked PNGs — that's what makes the device / theme / knob controls do
      # anything. Both default off, which is why the six samples all badged
      # "serves baked PNG snapshots only" on their first publish. These are
      # Android (Robolectric) renders and the serve host runs an Android daemon
      # (it already re-renders wear-m3, remote-m3 and meshcore-mobile:app live),
      # so `full` split mode — each per-preview bundle keeping its re-render
      # classpath — is the right tier here.
      publish-live-bundle: true
      split-per-preview: true
      split-mode: full
      allow-incomplete: ${{ matrix.allowIncomplete || inputs.allow_incomplete || false }}
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 90
